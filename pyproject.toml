[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextgates"
version = "0.1.0a0"
description = "Verified context gating for RAG: training-free structural admission plus an evidence ladder you run on your own data."
readme = "PYPI_README.md"
license = { text = "MIT" }
authors = [{ name = "Yongsun Lee", email = "bmt216ays@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["rag", "context", "compression", "llm", "evaluation", "gating", "llm-ops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]

[project.scripts]
contextgates = "contextgates.cli:main"

[project.optional-dependencies]
llamaindex = ["llama-index-core>=0.10"]
langchain = ["langchain-core>=0.2"]

[project.urls]
Homepage = "https://github.com/risky-dice/verified-context-gating"
Repository = "https://github.com/risky-dice/verified-context-gating"
Issues = "https://github.com/risky-dice/verified-context-gating/issues"

[tool.setuptools.packages.find]
include = ["contextgates*"]

[tool.setuptools.package-data]
contextgates = ["py.typed"]
